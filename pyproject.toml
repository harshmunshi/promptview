[project]
name = "promptview"
version = "0.1.0"
description = "Git-like versioning and visualization for LLM prompts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer[all]>=0.12",
    "rich>=13.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
    "tomli-w>=1.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "openai>=1.0",
    "anthropic>=0.20",
    "google-generativeai>=0.5",
]

[project.optional-dependencies]
langfuse = ["langfuse>=2.0"]
langsmith = ["langsmith>=0.1"]
s3 = ["boto3>=1.28"]
gcs = ["google-cloud-storage>=2.10"]
all = ["promptview[langfuse,langsmith]"]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocs-material-extensions>=1.3",
    "pymdown-extensions>=10.0",
]

[project.scripts]
promptview = "promptview.cli.main:app"
pv = "promptview.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/promptview"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-anyio>=0.0.0",
]
