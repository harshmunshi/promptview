<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PromptView</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'SF Mono','Fira Code',monospace;background:#0d1117;color:#c9d1d9;height:100vh;overflow:hidden;display:flex;flex-direction:column}

/* ── Toolbar ─────────────────────────────── */
#toolbar{height:48px;background:#161b22;border-bottom:1px solid #30363d;display:flex;align-items:center;padding:0 16px;gap:10px;flex-shrink:0}
#toolbar h1{font-size:15px;color:#58a6ff;font-weight:700;white-space:nowrap}
.sep{width:1px;height:24px;background:#30363d}
.btn{background:#21262d;border:1px solid #30363d;color:#c9d1d9;padding:5px 12px;border-radius:6px;cursor:pointer;font-size:12px;font-family:inherit;transition:all .15s;white-space:nowrap}
.btn:hover{background:#30363d;border-color:#58a6ff;color:#58a6ff}
.btn.primary{background:#1f6feb;border-color:#1f6feb;color:#fff}
.btn.primary:hover{background:#388bfd}
.btn.danger{border-color:#f85149;color:#f85149}
.btn.danger:hover{background:#3a1a1a}
.btn.success{border-color:#3fb950;color:#3fb950}
.btn.success:hover{background:#1a3a1a}
#llm-indicator{font-size:11px;color:#8b949e;display:flex;align-items:center;gap:6px;cursor:pointer;padding:4px 8px;border-radius:4px}
#llm-indicator:hover{background:#21262d}
#llm-dot{width:8px;height:8px;border-radius:50%;background:#f85149;flex-shrink:0}
#llm-dot.ok{background:#3fb950}
.spacer{flex:1}

/* ── Layout ──────────────────────────────── */
#main{display:flex;flex:1;overflow:hidden}

/* ── Sidebar ─────────────────────────────── */
#sidebar{width:240px;background:#161b22;border-right:1px solid #30363d;display:flex;flex-direction:column;flex-shrink:0}
#sidebar-header{padding:12px;border-bottom:1px solid #30363d;display:flex;align-items:center;gap:8px}
#sidebar-search{flex:1;background:#21262d;border:1px solid #30363d;color:#c9d1d9;padding:5px 8px;border-radius:4px;font-size:12px;font-family:inherit}
#sidebar-search:focus{outline:none;border-color:#58a6ff}
#prompt-list{flex:1;overflow-y:auto;padding:6px}
.prompt-item{padding:8px 10px;border-radius:5px;cursor:pointer;border:1px solid transparent;margin-bottom:2px}
.prompt-item:hover{background:#21262d}
.prompt-item.active{background:#1c2d5a;border-color:#58a6ff}
.prompt-item-name{font-size:12px;font-weight:600;color:#c9d1d9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prompt-item-meta{font-size:10px;color:#8b949e;margin-top:2px}
.source-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px;flex-shrink:0}

/* ── Graph area ──────────────────────────── */
#graph-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
#graph-header{padding:10px 16px;border-bottom:1px solid #30363d;display:flex;flex-direction:column;gap:8px;flex-shrink:0}
#graph-header-top{display:flex;align-items:center;gap:10px;min-height:30px}
#graph-header-top h2{font-size:14px;color:#8b949e;flex:1}
#graph-actions{display:none;gap:8px;align-items:center}
#graph-header-versions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-height:22px}
#versions-label{font-size:10px;color:#8b949e;white-space:nowrap;margin-right:2px}

/* ── Version pills ───────────────────────── */
.version-pill{padding:2px 9px;border-radius:10px;font-size:10px;cursor:pointer;border:1px solid #30363d;background:#21262d;color:#8b949e;font-family:inherit;transition:all .15s;white-space:nowrap}
.version-pill:hover{border-color:#58a6ff;color:#58a6ff}
.version-pill.active{background:#1c2d5a;border-color:#58a6ff;color:#58a6ff;font-weight:700}
.version-pill.uncommitted{border-style:dashed}
.version-pill.uncommitted.active{background:#1c3030;border-color:#3fb950;color:#3fb950}

#graph-empty{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:#8b949e}
#graph-empty p{font-size:13px}
#graph-canvas{flex:1;overflow:hidden;position:relative}
svg#graph{width:100%;height:100%}

/* ── Node styles ─────────────────────────── */
.node-group{cursor:pointer}
.node-card{rx:8;ry:8;fill:#161b22;stroke:#30363d;stroke-width:1.5}
.node-card.selected{stroke:#58a6ff;stroke-width:2}
.node-card:hover{stroke:#58a6ff}
.node-label-bg{fill:#1f6feb;rx:4;ry:4}
.node-label-text{fill:#fff;font-size:10px;font-weight:700;font-family:'SF Mono','Fira Code',monospace}
.node-content-text{fill:#c9d1d9;font-size:11px;font-family:'SF Mono','Fira Code',monospace}
.connector{stroke:#30363d;stroke-width:1.5;stroke-dasharray:4 3;marker-end:url(#arrow)}
.add-btn-circle{fill:#21262d;stroke:#30363d;stroke-width:1.5;cursor:pointer}
.add-btn-circle:hover{stroke:#3fb950;fill:#1a3a1a}
.add-btn-text{fill:#3fb950;font-size:14px;font-weight:700;pointer-events:none;dominant-baseline:middle;text-anchor:middle}
.delete-circle{fill:#21262d;stroke:#30363d;stroke-width:1.5;cursor:pointer}
.delete-circle:hover{stroke:#f85149;fill:#3a1a1a}
.delete-text{fill:#f85149;font-size:12px;font-weight:700;pointer-events:none;dominant-baseline:middle;text-anchor:middle}

/* ── Reconstructed prompt ────────────────── */
#prompt-footer{border-top:1px solid #30363d;background:#161b22;flex-shrink:0}
#prompt-footer-toggle{padding:8px 16px;cursor:pointer;font-size:12px;color:#8b949e;display:flex;align-items:center;gap:6px;user-select:none}
#prompt-footer-toggle:hover{color:#c9d1d9}
#prompt-footer-body{display:none;padding:12px 16px;max-height:200px;overflow-y:auto}
#prompt-footer-body.open{display:block}
#reconstructed-text{font-size:12px;line-height:1.6;white-space:pre-wrap;color:#c9d1d9;background:#0d1117;border:1px solid #30363d;border-radius:6px;padding:10px}

/* ── Edit panel ──────────────────────────── */
#edit-panel{width:360px;background:#161b22;border-left:1px solid #30363d;display:flex;flex-direction:column;transform:translateX(360px);transition:transform .2s ease;flex-shrink:0}
#edit-panel.open{transform:translateX(0)}
#edit-panel-header{padding:12px 16px;border-bottom:1px solid #30363d;display:flex;align-items:center;gap:8px}
#edit-panel-header h3{flex:1;font-size:13px;color:#58a6ff}
#edit-close{background:none;border:none;color:#8b949e;cursor:pointer;font-size:16px}
#edit-close:hover{color:#c9d1d9}
#edit-label-input{width:100%;background:#21262d;border:1px solid #30363d;color:#c9d1d9;padding:6px 10px;border-radius:4px;font-size:12px;font-family:inherit;margin-bottom:8px}
#edit-label-input:focus{outline:none;border-color:#58a6ff}
#edit-content-input{width:100%;min-height:180px;background:#0d1117;border:1px solid #30363d;color:#c9d1d9;padding:10px;border-radius:4px;font-size:12px;font-family:inherit;resize:vertical;line-height:1.6}
#edit-content-input:focus{outline:none;border-color:#58a6ff}
#edit-panel-body{padding:12px 16px;flex:1;overflow-y:auto}
#edit-panel-actions{padding:10px 16px;border-top:1px solid #30363d;display:flex;gap:8px}

/* ── Modal ───────────────────────────────── */
#modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;z-index:100;align-items:center;justify-content:center}
#modal-overlay.open{display:flex}
#modal{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:24px;width:460px;max-height:80vh;overflow-y:auto}
#modal h3{font-size:15px;color:#58a6ff;margin-bottom:16px}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:11px;color:#8b949e;margin-bottom:4px}
.form-group input,.form-group textarea,.form-group select{width:100%;background:#0d1117;border:1px solid #30363d;color:#c9d1d9;padding:7px 10px;border-radius:4px;font-family:inherit;font-size:12px}
.form-group textarea{min-height:100px;resize:vertical;line-height:1.6}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{outline:none;border-color:#58a6ff}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

/* ── Toast ───────────────────────────────── */
#toast{position:fixed;bottom:20px;right:20px;background:#1f6feb;color:#fff;padding:8px 16px;border-radius:6px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:200}
#toast.show{opacity:1}
#toast.error{background:#b91c1c}

/* ── Spinner ─────────────────────────────── */
.spinner{width:14px;height:14px;border:2px solid #30363d;border-top-color:#58a6ff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- Toolbar -->
<div id="toolbar">
  <h1>⚡ PromptView</h1>
  <div class="sep"></div>
  <div id="llm-indicator" onclick="openLLMModal()" title="Configure LLM">
    <div id="llm-dot"></div>
    <span id="llm-label">LLM not configured</span>
  </div>
  <div class="spacer"></div>
  <button class="btn" onclick="triggerScan()">⟳ Scan</button>
  <button class="btn primary" onclick="openCommitModal()">✓ Commit</button>
  <button class="btn" onclick="openAddPromptModal()">+ Prompt</button>
</div>

<!-- Main -->
<div id="main">

  <!-- Sidebar -->
  <div id="sidebar">
    <div id="sidebar-header">
      <input id="sidebar-search" placeholder="Filter prompts…" oninput="filterPrompts(this.value)"/>
    </div>
    <div id="prompt-list"></div>
  </div>

  <!-- Graph area -->
  <div id="graph-area">
    <div id="graph-header">
      <!-- Row 1: title + action buttons -->
      <div id="graph-header-top">
        <h2 id="graph-title">Select a prompt from the sidebar</h2>
        <div id="graph-actions">
          <button class="btn" id="decompose-btn" onclick="decomposeSelected()">✦ Decompose with LLM</button>
          <button class="btn success" id="save-btn" style="display:none" onclick="saveComponents()">💾 Save &amp; Regenerate</button>
        </div>
      </div>
      <!-- Row 2: version pills -->
      <div id="graph-header-versions" style="display:none">
        <span id="versions-label">Versions:</span>
        <div id="version-pills" style="display:flex;gap:4px;flex-wrap:wrap"></div>
      </div>
    </div>

    <div id="graph-empty">
      <p>Select a prompt to view its components</p>
      <p style="font-size:11px">Use <kbd style="background:#21262d;padding:2px 6px;border-radius:3px">Decompose with LLM</kbd> to analyse a prompt</p>
    </div>
    <div id="graph-canvas" style="display:none">
      <svg id="graph">
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#30363d"/>
          </marker>
        </defs>
      </svg>
    </div>

    <!-- Reconstructed prompt footer -->
    <div id="prompt-footer" style="display:none">
      <div id="prompt-footer-toggle" onclick="toggleFooter()">
        <span id="footer-arrow">▶</span> Prompt Text
        <span id="footer-version" style="margin-left:8px;font-size:10px;color:#3fb950"></span>
      </div>
      <div id="prompt-footer-body">
        <pre id="reconstructed-text"></pre>
      </div>
    </div>
  </div>

  <!-- Edit panel -->
  <div id="edit-panel">
    <div id="edit-panel-header">
      <h3>Edit Component</h3>
      <button id="edit-close" onclick="closeEditPanel()">✕</button>
    </div>
    <div id="edit-panel-body">
      <div class="form-group">
        <label>Label</label>
        <input id="edit-label-input" placeholder="e.g. Role, Instructions…"/>
      </div>
      <div class="form-group">
        <label>Content</label>
        <textarea id="edit-content-input"></textarea>
      </div>
    </div>
    <div id="edit-panel-actions">
      <button class="btn" onclick="closeEditPanel()">Cancel</button>
      <button class="btn danger" id="delete-component-btn" onclick="deleteEditedComponent()">🗑 Delete</button>
      <button class="btn primary" onclick="applyEditedComponent()">Apply</button>
    </div>
  </div>
</div>

<!-- Modals -->
<div id="modal-overlay" onclick="closeModal(event)">
  <div id="modal" onclick="event.stopPropagation()">
    <h3 id="modal-title"></h3>
    <div id="modal-body"></div>
  </div>
</div>

<div id="toast"></div>

<script>
// ─── State ────────────────────────────────────────────────────────────────────
let allPrompts = [];
let selectedPromptId = null;
let allVersions = [];          // all versions for the selected prompt
let currentVersionId = null;   // the version currently being viewed
let components = [];           // working copy of components for currentVersionId
let editingIndex = null;
let dirty = false;
let llmConfig = null;          // {provider, api_key, model}

// Restore LLM config from localStorage
(function(){
  const saved = localStorage.getItem('pv_llm');
  if(saved){ try{ llmConfig = JSON.parse(saved); updateLLMIndicator(); }catch(e){} }
})();

// ─── Boot ─────────────────────────────────────────────────────────────────────
async function init(){
  await loadPrompts();
}

// ─── Prompts ──────────────────────────────────────────────────────────────────
async function loadPrompts(){
  allPrompts = await api('/api/prompts');
  renderSidebar(allPrompts);
}

function renderSidebar(prompts){
  const list = document.getElementById('prompt-list');
  if(!prompts.length){
    list.innerHTML = '<div style="padding:12px;font-size:12px;color:#8b949e">No prompts found.<br>Run scan to discover prompts.</div>';
    return;
  }
  list.innerHTML = prompts.map(p => `
    <div class="prompt-item${p.id===selectedPromptId?' active':''}" onclick="selectPrompt('${p.id}')" id="pi_${p.id}">
      <div class="prompt-item-name">
        <span class="source-dot" style="background:${sourceColor(p.source)}"></span>${escHtml(p.name)}
      </div>
      <div class="prompt-item-meta">${p.source} · v${p.latest_version||1} · ${p.version_count} version${p.version_count!==1?'s':''}</div>
    </div>
  `).join('');
}

function filterPrompts(q){
  const lower = q.toLowerCase();
  renderSidebar(allPrompts.filter(p => !q || p.name.toLowerCase().includes(lower)));
}

async function selectPrompt(id){
  selectedPromptId = id;
  dirty = false;
  closeEditPanel();

  // Sidebar highlight
  document.querySelectorAll('.prompt-item').forEach(el => el.classList.remove('active'));
  const el = document.getElementById('pi_'+id);
  if(el) el.classList.add('active');

  const prompt = allPrompts.find(p => p.id === id);
  const titleEl = document.getElementById('graph-title');
  titleEl.textContent = prompt ? prompt.name : id;
  titleEl.style.color = '#58a6ff';
  document.getElementById('graph-actions').style.display = 'flex';
  document.getElementById('save-btn').style.display = 'none';

  // Load all versions and show pills
  try {
    allVersions = await api(`/api/prompts/${id}/versions`);
  } catch(e) {
    allVersions = [];
  }

  // Default to the latest version
  currentVersionId = allVersions.length ? allVersions[allVersions.length - 1].id : null;
  renderVersionPills();

  // Load components for that version
  await loadComponentsForVersion(currentVersionId);
}

// ─── Versions ────────────────────────────────────────────────────────────────

function renderVersionPills(){
  const wrap = document.getElementById('graph-header-versions');
  const container = document.getElementById('version-pills');

  if(!allVersions.length){
    wrap.style.display = 'none';
    container.innerHTML = '';
    return;
  }

  wrap.style.display = 'flex';
  // Newest first in the pill row
  const sorted = [...allVersions].reverse();
  container.innerHTML = sorted.map(v => {
    const isActive = v.id === currentVersionId;
    const uncommitted = !v.commit_id;
    let cls = 'version-pill';
    if(isActive) cls += ' active';
    if(uncommitted) cls += ' uncommitted';
    const title = uncommitted ? 'Staged / not committed' : `Committed`;
    return `<button class="${cls}" onclick="switchVersion('${v.id}')" title="${title}">v${v.version_number}</button>`;
  }).join('');
}

async function switchVersion(versionId){
  if(dirty && !confirm('You have unsaved changes. Switch version anyway?')) return;
  currentVersionId = versionId;
  dirty = false;
  document.getElementById('save-btn').style.display = 'none';
  renderVersionPills();
  closeEditPanel();
  await loadComponentsForVersion(versionId);
}

async function loadComponentsForVersion(versionId){
  if(!versionId){
    components = [];
    showEmpty();
    return;
  }

  try {
    const stored = await api(`/api/prompts/${selectedPromptId}/components?version_id=${versionId}`);
    if(stored.length){
      components = stored.map(c => ({id:c.id, label:c.label, content:c.content}));
      showGraph();
    } else {
      components = [];
      showEmpty();
    }
  } catch(e){
    components = [];
    showEmpty();
  }

  // Update footer with the version's raw content
  const version = allVersions.find(v => v.id === versionId);
  if(version) showFooterContent(version.raw_content, version.version_number, !version.commit_id);
}

// ─── Decompose ────────────────────────────────────────────────────────────────
async function decomposeSelected(){
  if(!selectedPromptId) return;
  if(!llmConfig){ openLLMModal(); return; }

  const btn = document.getElementById('decompose-btn');
  btn.innerHTML = '<span class="spinner"></span> Decomposing…';
  btn.disabled = true;

  try {
    const result = await api(`/api/prompts/${selectedPromptId}/decompose`, 'POST', {
      provider: llmConfig.provider,
      api_key: llmConfig.api_key,
      model: llmConfig.model || null,
      version_id: currentVersionId || null,
    });
    components = result.map(c => ({id:c.id, label:c.label, content:c.content}));
    dirty = false;
    showGraph();
    showToast(`Decomposed into ${components.length} components`);
  } catch(e){
    showToast(e.message, true);
  } finally {
    btn.innerHTML = '✦ Decompose with LLM';
    btn.disabled = false;
  }
}

// ─── Graph ────────────────────────────────────────────────────────────────────
const NODE_W = 260;
const NODE_GAP = 60;
const PADDING = 40;

function showEmpty(){
  document.getElementById('graph-canvas').style.display = 'none';
  document.getElementById('graph-empty').style.display = 'flex';
  document.getElementById('prompt-footer').style.display = 'none';
}

function showGraph(){
  document.getElementById('graph-empty').style.display = 'none';
  document.getElementById('graph-canvas').style.display = 'block';
  document.getElementById('prompt-footer').style.display = 'block';
  renderGraph();
}

function renderGraph(){
  const svg = d3.select('#graph');
  svg.selectAll('*').remove();

  if(!components.length){ showEmpty(); return; }

  const W = document.getElementById('graph-canvas').clientWidth || 800;

  const measured = components.map(c => ({
    ...c,
    lines: wrapText(c.content, 34),
  }));

  const cx = W / 2;
  let y = PADDING;
  const positions = measured.map((c, i) => {
    const h = 28 + c.lines.length * 14 + 16;
    const pos = {x: cx - NODE_W/2, y, h, i};
    y += h + NODE_GAP;
    return pos;
  });
  const totalH = y + PADDING;

  svg.attr('height', Math.max(totalH, 300));

  const g = svg.append('g');

  // Zoom + pan
  svg.call(d3.zoom().scaleExtent([0.3, 2]).on('zoom', e => g.attr('transform', e.transform)));

  // Connectors + add-node buttons between nodes
  positions.forEach((pos, i) => {
    if(i < positions.length - 1){
      const next = positions[i+1];
      const y1 = pos.y + pos.h;
      const y2 = next.y;
      const midY = (y1 + y2) / 2;

      g.append('line')
        .attr('class','connector')
        .attr('x1', cx).attr('y1', y1 + 4)
        .attr('x2', cx).attr('y2', y2 - 4);

      const addG = g.append('g')
        .attr('transform', `translate(${cx},${midY})`)
        .style('cursor','pointer')
        .on('click', () => openAddComponentModal(i+1));
      addG.append('circle').attr('class','add-btn-circle').attr('r', 10);
      addG.append('text').attr('class','add-btn-text').attr('dy','0.05em').text('+');
    }
  });

  // Draw nodes
  measured.forEach((c, i) => {
    const pos = positions[i];
    const nodeG = g.append('g')
      .attr('class','node-group')
      .attr('transform', `translate(${pos.x},${pos.y})`)
      .on('click', () => openEditPanel(i));

    nodeG.append('rect')
      .attr('class','node-card')
      .attr('width', NODE_W)
      .attr('height', pos.h)
      .attr('rx', 8);

    const labelW = Math.min(c.label.length * 7 + 16, NODE_W - 20);
    nodeG.append('rect')
      .attr('class','node-label-bg')
      .attr('x', 10).attr('y', 8)
      .attr('width', labelW).attr('height', 16)
      .attr('rx', 4);
    nodeG.append('text')
      .attr('class','node-label-text')
      .attr('x', 10 + labelW/2).attr('y', 16 + 2)
      .attr('text-anchor','middle')
      .text(c.label);

    c.lines.forEach((line, li) => {
      nodeG.append('text')
        .attr('class','node-content-text')
        .attr('x', 12)
        .attr('y', 32 + li * 14)
        .text(line);
    });

    // Delete button (top-right)
    const delG = nodeG.append('g')
      .attr('transform', `translate(${NODE_W - 14},10)`)
      .style('cursor','pointer')
      .on('click', (e) => { e.stopPropagation(); confirmDeleteComponent(i); });
    delG.append('circle').attr('class','delete-circle').attr('r', 8);
    delG.append('text').attr('class','delete-text').attr('dy','0.05em').text('×');
  });

  // "+" at the very end
  const lastPos = positions[positions.length - 1];
  const endY = lastPos.y + lastPos.h + NODE_GAP / 2;
  const addEndG = g.append('g')
    .attr('transform', `translate(${cx},${endY})`)
    .style('cursor','pointer')
    .on('click', () => openAddComponentModal(components.length));
  addEndG.append('circle').attr('class','add-btn-circle').attr('r', 10);
  addEndG.append('text').attr('class','add-btn-text').attr('dy','0.05em').text('+');
}

function wrapText(text, maxChars){
  const words = text.split(' ');
  const lines = [];
  let cur = '';
  for(const w of words){
    if((cur + ' ' + w).trim().length > maxChars){
      if(cur) lines.push(cur);
      cur = w;
    } else {
      cur = (cur + ' ' + w).trim();
    }
    if(lines.length >= 4){ break; }
  }
  if(cur && lines.length < 4) lines.push(cur);
  if(lines.length === 4 && text.length > lines.join(' ').length + 5){
    lines[3] = lines[3].slice(0, maxChars - 1) + '…';
  }
  return lines;
}

// ─── Edit panel ───────────────────────────────────────────────────────────────
function openEditPanel(index){
  editingIndex = index;
  const c = components[index];
  document.getElementById('edit-label-input').value = c.label;
  document.getElementById('edit-content-input').value = c.content;
  document.getElementById('edit-panel').classList.add('open');
}

function closeEditPanel(){
  document.getElementById('edit-panel').classList.remove('open');
  editingIndex = null;
}

function applyEditedComponent(){
  if(editingIndex === null) return;
  components[editingIndex] = {
    ...components[editingIndex],
    label: document.getElementById('edit-label-input').value.trim() || components[editingIndex].label,
    content: document.getElementById('edit-content-input').value,
  };
  dirty = true;
  document.getElementById('save-btn').style.display = '';
  closeEditPanel();
  renderGraph();
}

function deleteEditedComponent(){
  if(editingIndex === null) return;
  components.splice(editingIndex, 1);
  dirty = true;
  closeEditPanel();
  if(components.length === 0){ showEmpty(); }
  else { renderGraph(); document.getElementById('save-btn').style.display = ''; }
}

function confirmDeleteComponent(index){
  if(!confirm(`Delete "${components[index].label}" component?`)) return;
  components.splice(index, 1);
  dirty = true;
  if(components.length === 0){ showEmpty(); }
  else { renderGraph(); document.getElementById('save-btn').style.display = ''; }
}

// ─── Add component modal ──────────────────────────────────────────────────────
let insertAtPosition = 0;

function openAddComponentModal(position){
  if(!llmConfig){ openLLMModal(); return; }
  insertAtPosition = position;
  document.getElementById('modal-title').textContent = 'Add Component';
  document.getElementById('modal-body').innerHTML = `
    <div class="form-group"><label>Label</label>
      <input id="new-comp-label" placeholder="e.g. Instructions, Constraints…"/>
    </div>
    <div class="form-group"><label>Content</label>
      <textarea id="new-comp-content" placeholder="Write the component text here…"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn primary" onclick="submitAddComponent()">Add</button>
    </div>
  `;
  document.getElementById('modal-overlay').classList.add('open');
  document.getElementById('new-comp-label').focus();
}

function submitAddComponent(){
  const label = document.getElementById('new-comp-label').value.trim();
  const content = document.getElementById('new-comp-content').value.trim();
  if(!label || !content){ showToast('Label and content required', true); return; }
  components.splice(insertAtPosition, 0, {id:'_new_'+Date.now(), label, content});
  dirty = true;
  document.getElementById('save-btn').style.display = '';
  closeModal();
  showGraph();
}

// ─── Save & Regenerate ────────────────────────────────────────────────────────
async function saveComponents(){
  if(!llmConfig){ openLLMModal(); return; }
  if(!selectedPromptId) return;

  const btn = document.getElementById('save-btn');
  btn.innerHTML = '<span class="spinner"></span> Regenerating…';
  btn.disabled = true;

  try {
    const result = await api(`/api/prompts/${selectedPromptId}/components`, 'PUT', {
      provider: llmConfig.provider,
      api_key: llmConfig.api_key,
      model: llmConfig.model || null,
      components: components.map(c => ({label:c.label, content:c.content})),
    });

    // Refresh version list and jump to the new version
    allVersions = await api(`/api/prompts/${selectedPromptId}/versions`);
    currentVersionId = result.version_id;
    renderVersionPills();

    // Update local state from response
    components = result.components.map(c => ({id:c.id, label:c.label, content:c.content}));
    dirty = false;
    btn.style.display = 'none';
    renderGraph();
    showFooterContent(result.new_content, result.version_number, true);
    showToast(`Saved as v${result.version_number}`);
    await loadPrompts();
  } catch(e){
    showToast(e.message, true);
  } finally {
    btn.innerHTML = '💾 Save & Regenerate';
    btn.disabled = false;
  }
}

// ─── Footer ───────────────────────────────────────────────────────────────────
function showFooterContent(content, versionNum, uncommitted){
  if(!content) return;
  document.getElementById('reconstructed-text').textContent = content;
  const verEl = document.getElementById('footer-version');
  if(versionNum){
    verEl.textContent = `v${versionNum}${uncommitted ? ' (staged)' : ' (committed)'}`;
    verEl.style.color = uncommitted ? '#3fb950' : '#8b949e';
  } else {
    verEl.textContent = '';
  }
  document.getElementById('prompt-footer').style.display = 'block';
}

function toggleFooter(){
  const body = document.getElementById('prompt-footer-body');
  const arrow = document.getElementById('footer-arrow');
  const open = body.classList.toggle('open');
  arrow.textContent = open ? '▼' : '▶';
}

// ─── LLM Config ───────────────────────────────────────────────────────────────
function openLLMModal(){
  const cur = llmConfig || {};
  document.getElementById('modal-title').textContent = '⚙ Configure LLM';
  const isOllama = cur.provider === 'ollama';
  document.getElementById('modal-body').innerHTML = `
    <div class="form-group"><label>Provider</label>
      <select id="llm-provider" onchange="onProviderChange(this.value)">
        <option value="openai"${cur.provider==='openai'?' selected':''}>OpenAI</option>
        <option value="anthropic"${cur.provider==='anthropic'?' selected':''}>Anthropic</option>
        <option value="gemini"${cur.provider==='gemini'?' selected':''}>Google Gemini</option>
        <option value="ollama"${cur.provider==='ollama'?' selected':''}>Ollama (local)</option>
      </select>
    </div>
    <div class="form-group" id="llm-key-group" style="${isOllama?'display:none':''}">
      <label>API Key</label>
      <input id="llm-key" type="password" placeholder="sk-…" value="${cur.api_key||''}"/>
    </div>
    <div id="ollama-hint" style="display:${isOllama?'block':'none'};padding:8px 10px;background:#161b22;border-radius:6px;border:1px solid #30363d;font-size:12px;color:#8b949e;margin-bottom:8px;">
      🦙 No API key needed. Requires <a href="https://ollama.com" target="_blank" style="color:#58a6ff;">Ollama</a> running locally.<br/>
      Pull a model first: <code style="color:#e6edf3;">ollama pull llama3</code>
    </div>
    <div class="form-group"><label>Model <span style="color:#8b949e">(leave blank for default)</span></label>
      <input id="llm-model" placeholder="${isOllama?'e.g. llama3, mistral, gemma3':'e.g. gpt-4o, claude-sonnet-4-6, gemini-2.0-flash'}" value="${cur.model||''}"/>
    </div>
    <div class="modal-actions">
      <button class="btn danger" onclick="clearLLM()">Clear</button>
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn primary" onclick="saveLLM()">Save</button>
    </div>
  `;
  document.getElementById('modal-overlay').classList.add('open');
}

function onProviderChange(provider){
  const keyGroup = document.getElementById('llm-key-group');
  const hint = document.getElementById('ollama-hint');
  const modelInput = document.getElementById('llm-model');
  const isOllama = provider === 'ollama';
  keyGroup.style.display = isOllama ? 'none' : '';
  hint.style.display = isOllama ? 'block' : 'none';
  modelInput.placeholder = isOllama
    ? 'e.g. llama3, mistral, gemma3'
    : 'e.g. gpt-4o, claude-sonnet-4-6, gemini-2.0-flash';
}

function saveLLM(){
  const provider = document.getElementById('llm-provider').value;
  const key = document.getElementById('llm-key').value.trim();
  const model = document.getElementById('llm-model').value.trim();
  if(provider !== 'ollama' && !key){ showToast('API key required', true); return; }
  llmConfig = {provider, api_key: key, model: model||null};
  localStorage.setItem('pv_llm', JSON.stringify(llmConfig));
  updateLLMIndicator();
  closeModal();
  showToast('LLM configured');
}

function clearLLM(){
  llmConfig = null;
  localStorage.removeItem('pv_llm');
  updateLLMIndicator();
  closeModal();
}

function updateLLMIndicator(){
  const dot = document.getElementById('llm-dot');
  const label = document.getElementById('llm-label');
  if(llmConfig){
    dot.className = 'ok';
    const model = llmConfig.model || 'default';
    label.textContent = `${llmConfig.provider} · ${model}`;
  } else {
    dot.className = '';
    label.textContent = 'LLM not configured';
  }
}

// ─── Scan / Commit ────────────────────────────────────────────────────────────
async function triggerScan(){
  showToast('Scanning…');
  try {
    const r = await api('/api/scan','POST');
    showToast(`Found ${r.found} prompt(s)`);
    await loadPrompts();
  } catch(e){ showToast(e.message, true); }
}

function openCommitModal(){
  document.getElementById('modal-title').textContent = 'Commit Staged Prompts';
  document.getElementById('modal-body').innerHTML = `
    <div class="form-group"><label>Message</label>
      <input id="commit-msg" placeholder="Update system prompt…"/>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn primary" onclick="submitCommit()">Commit</button>
    </div>
  `;
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(()=>document.getElementById('commit-msg').focus(), 50);
}

async function submitCommit(){
  const msg = document.getElementById('commit-msg').value.trim();
  if(!msg){ showToast('Message required', true); return; }
  try {
    const r = await api('/api/commit','POST',{message:msg});
    closeModal();
    showToast(`Committed ${r.id.slice(0,8)}`);
    await loadPrompts();
    // Refresh version pills (commit_id now filled in)
    if(selectedPromptId){
      allVersions = await api(`/api/prompts/${selectedPromptId}/versions`);
      renderVersionPills();
      // Update footer badge
      const v = allVersions.find(v => v.id === currentVersionId);
      if(v) showFooterContent(v.raw_content, v.version_number, false);
    }
  } catch(e){ showToast(e.message||'Nothing staged', true); }
}

// ─── Add prompt modal ─────────────────────────────────────────────────────────
function openAddPromptModal(){
  document.getElementById('modal-title').textContent = 'Add Prompt';
  document.getElementById('modal-body').innerHTML = `
    <div class="form-group"><label>Name</label><input id="new-name" placeholder="my_system_prompt"/></div>
    <div class="form-group"><label>Content</label><textarea id="new-content" placeholder="You are a helpful assistant…"></textarea></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn primary" onclick="submitAddPrompt()">Add</button>
    </div>
  `;
  document.getElementById('modal-overlay').classList.add('open');
}

async function submitAddPrompt(){
  const name = document.getElementById('new-name').value.trim();
  const content = document.getElementById('new-content').value;
  if(!name||!content){ showToast('Name and content required', true); return; }
  try {
    await api('/api/prompts','POST',{name,content});
    closeModal();
    showToast(`Added: ${name}`);
    await loadPrompts();
  } catch(e){ showToast(e.message, true); }
}

// ─── Modal helpers ────────────────────────────────────────────────────────────
function closeModal(e){
  if(e && e.target !== document.getElementById('modal-overlay')) return;
  document.getElementById('modal-overlay').classList.remove('open');
}

// ─── Utils ────────────────────────────────────────────────────────────────────
const SOURCE_COLORS = {openai:'#56d364',anthropic:'#f0883e',langchain:'#79c0ff',litellm:'#d2a8ff',raw:'#8b949e',manual:'#58a6ff'};
function sourceColor(s){ return SOURCE_COLORS[s]||'#8b949e'; }

async function api(url, method='GET', body=null){
  const opts = {method, headers:{'Content-Type':'application/json'}};
  if(body) opts.body = JSON.stringify(body);
  const res = await fetch(url, opts);
  if(!res.ok){
    const err = await res.json().catch(()=>({detail:res.statusText}));
    throw new Error(err.detail||res.statusText);
  }
  if(res.status===204) return null;
  return res.json();
}

function escHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function showToast(msg, isErr=false){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = isErr ? 'show error' : 'show';
  clearTimeout(t._tid);
  t._tid = setTimeout(()=>t.className='', 3500);
}

// ─── Start ────────────────────────────────────────────────────────────────────
init();
</script>
